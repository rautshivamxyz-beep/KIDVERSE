plugins { id 'com.android.application' }

android {
    namespace 'com.kidverse.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.kidverse.app'
        minSdk 23
        targetSdk 35
        versionCode (project.findProperty('appVersionCode') ?: '20000').toInteger()
        versionName (project.findProperty('appVersionName') ?: '0.2.0').toString()
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
