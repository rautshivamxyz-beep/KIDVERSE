plugins { id 'com.android.application' }

def appVersionCodeValue = project.hasProperty('appVersionCode') ? project.property('appVersionCode').toString().toInteger() : 20000
def appVersionNameValue = project.hasProperty('appVersionName') ? project.property('appVersionName').toString() : '0.2.0'

android {
    namespace 'com.kidverse.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.kidverse.app'
        minSdk 23
        targetSdk 35
        versionCode appVersionCodeValue
        versionName appVersionNameValue
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
