name: Build KIDVERSE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: kidverse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-debug:
    name: Validate content and build test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate lesson content
        run: python3 scripts/validate_content.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK for testing
        run: gradle --no-daemon clean assembleDebug

      - name: Verify debug APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: KIDVERSE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release:
    name: Build and publish signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate-and-debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Validate release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0."
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=$((10#$MAJOR))
          MINOR=$((10#$MINOR))
          PATCH=$((10#$PATCH))
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "MINOR and PATCH must each be below 100 for this version-code scheme."
            exit 1
          fi
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "Calculated Android versionCode is outside the supported range."
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare permanent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KIDVERSE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KIDVERSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KIDVERSE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || (echo "Missing KIDVERSE_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing KIDVERSE_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KIDVERSE_KEY_ALIAS secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kidverse-release.jks"
          chmod 600 "$RUNNER_TEMP/kidverse-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/kidverse-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/kidverse-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KIDVERSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KIDVERSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KIDVERSE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          test -n "$KEY_PASSWORD"
          gradle --no-daemon clean assembleRelease \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION_NAME" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" KIDVERSE.apk
          sha256sum KIDVERSE.apk | tee KIDVERSE.apk.sha256

      - name: Publish release and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" KIDVERSE.apk KIDVERSE.apk.sha256 \
            --title "KIDVERSE $GITHUB_REF_NAME" --generate-notes

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/kidverse-release.jks"
