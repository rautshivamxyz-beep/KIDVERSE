name: Build KIDVERSE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build and verify KIDVERSE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK for testing
        run: gradle --no-daemon clean assembleDebug
      - name: Verify debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: KIDVERSE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare stable release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KIDVERSE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KIDVERSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KIDVERSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KIDVERSE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KIDVERSE_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing KIDVERSE_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KIDVERSE_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KIDVERSE_KEY_PASSWORD secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kidverse-release.jks"
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/kidverse-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KIDVERSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KIDVERSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KIDVERSE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          gradle --no-daemon assembleRelease \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk KIDVERSE.apk
          test -s KIDVERSE.apk
          sha256sum KIDVERSE.apk
      - name: Publish update release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KIDVERSE ${{ github.ref_name }}
          generate_release_notes: true
          files: KIDVERSE.apk
